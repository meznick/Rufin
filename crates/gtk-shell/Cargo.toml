[package]
name = "gtk-shell"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true

[features]
# Forwards the ipod crate's write-surface gate (b017_plan §4, step 0):
# `cargo build -p rufin -F gtk-shell/sync-writes` compiles the whole
# graph with real device writes enabled. Stays opt-in until B-017's
# gate flip (D-3) makes it default-on.
sync-writes = ["ipod/sync-writes"]

[dependencies]
gtk-preferences.workspace = true
web.workspace = true
gtk-media-menus.workspace = true
gtk-editors.workspace = true
gtk-library.workspace = true
gtk-player.workspace = true
gtk-widgets.workspace = true
rufin-core.workspace = true
adw = { workspace = true, features = ["v1_9", "gtk_v4_20"] }
app-identity.workspace = true
async-channel.workspace = true
artwork.workspace = true
desktop-integration.workspace = true
downloads.workspace = true
gtk = { workspace = true, features = ["v4_20"] }
library.workspace = true
localization.workspace = true
lyrics.workspace = true
playback.workspace = true
secrets.workspace = true
sources.workspace = true
audio-processing.workspace = true
gstreamer.workspace = true
ipod.workspace = true
ipod-sync.workspace = true
# The artwork provider's pid → path resolution reads the `.itl` the
# configured source points at (b017_plan §8, the A3 enabler) — the same
# registry crates the sources crate's iTunes catalog uses.
itl-core = "0.1.3"
itl-sync = "0.1.0"
tracing.workspace = true
tokio.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ashpd.workspace = true

[dev-dependencies]
tempfile.workspace = true
proptest = "1.6.0"
serde_json.workspace = true

[build-dependencies]
glib-build-tools.workspace = true

[lints]
workspace = true
