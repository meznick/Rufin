[package]
name = "ipod-sync"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true

[dependencies]
ipod.workspace = true
itl-core = "0.1.1"
itl-sync = "0.1.0"
libc.workspace = true
tracing.workspace = true
thiserror.workspace = true
# The B-011 progress pipe (bounded, advisory, drop-on-full).
async-channel.workspace = true
# The B-010 journal (on-device operation record) — pure JSON, no cycles.
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
# Test fixtures build fresh device trees with libgpod's own
# `itdb_init_ipod` via `ipod::testkit::init_device` — the write surface,
# gated by the wrapper's sync-writes feature. Dev-only: the published crate
# keeps its normal dependency read-side.
ipod = { workspace = true, features = ["sync-writes"] }
# The dry-run gate's host artwork probe uses the same parser the sources
# crate's production scanner is built on (its `inspect_embedded` is
# crate-private) — owner decision b009_plan §9-1 (dev-dependency for the
# artwork evidence).
lofty.workspace = true
# The B-010a acceptance gate drives the real AAC-256 encoder and needs
# filename→URI conversion for the generated source — both dev-only
# (`deltas/b010a_plan.md` §3.4); production deps stay read-side and
# GStreamer-free.
audio-processing.workspace = true
gstreamer.workspace = true
