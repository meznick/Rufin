[package]
name = "ipod-sync"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true

[dependencies]
ipod.workspace = true
itl-core = "0.1.1"
itl-sync = "0.1.0"
libc.workspace = true
tracing.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
# Test fixtures build fresh device trees with libgpod's own
# `itdb_init_ipod` via `ipod::testkit::init_device` — the write surface,
# gated by the wrapper's sync-writes feature. Dev-only: the published crate
# keeps its normal dependency read-side.
ipod = { workspace = true, features = ["sync-writes"] }
# The dry-run gate's host artwork probe uses the same parser the sources
# crate's production scanner is built on (its `inspect_embedded` is
# crate-private) — owner decision b009_plan §9-1 (dev-dependency for the
# artwork evidence).
lofty.workspace = true
