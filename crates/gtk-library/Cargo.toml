[package]
name = "gtk-library"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true

[dependencies]
gtk-media-menus.workspace = true
sources.workspace = true
downloads.workspace = true
ipod-sync.workspace = true
# The production preflight composition (`preflight_with_backend`) needs the
# backend handle. The ipod crate is pure Rust with runtime dlopen, so this
# stays a compile-time-only edge — builds without libgpod.so still work.
ipod.workspace = true
# The B-006 observer stream (glib 0.22 dropped watch_channel; async-channel
# is its sanctioned replacement and already a workspace dependency).
async-channel.workspace = true

tracing.workspace = true
gtk-widgets.workspace = true
rufin-core.workspace = true
library.workspace = true
playback.workspace = true
artwork.workspace = true
localization.workspace = true
gtk = { workspace = true, features = ["v4_20"] }
adw = { workspace = true, features = ["v1_9", "gtk_v4_20"] }
tokio.workspace = true


[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

[build-dependencies]
glib-build-tools.workspace = true
